# Render deployment configuration for Job Faculty Portal
# Features: AI-powered interviews, resume shortlisting, job applications
services:
  - type: web
    name: job-fa
    runtime: node
    autoDeploy: true
    # Updated to trigger redeploy: 2026-05-20T00:00:00Z
    buildCommand: npm install && mkdir -p uploads
    startCommand: npm start
    disk:
      name: job-fa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        value: /var/data/database.db
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_ID_ALT
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://job-fa.onrender.com/auth/google/callback
      - key: GOOGLE_CALLBACK_URL
        value: https://job-fa.onrender.com/auth/google/callback
      - key: FIREBASE_CLIENT_ID
        value: 62016617558-2gcb7841fha9u1nre7alu2pt0s29b0m8.apps.googleusercontent.com
      - key: FIREBASE_CLIENT_ID_ALT
        value: 62016617558-2gcb7841fha9u1nre7alu2pt0s29b0m8.apps.googleusercontent.com
      - key: FIREBASE_PROJECT_ID
        value: job-faculty
      - key: FIREBASE_API_KEY
        value: AIzaSyB_PLqF1qcEEhnrYaUA1k5Tsi61MW0xZS8
      - key: PORT
        value: 10000