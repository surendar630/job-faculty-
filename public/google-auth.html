<script type="module">
  import { initFirebaseAuth, signInWithPopup } from './firebase-config.js';

  window.signInWithGoogle = async function() {
    try {
      const { auth, googleProvider } = await initFirebaseAuth();
      const result = await signInWithPopup(auth, googleProvider);
      const response = await fetch('/auth/google-firebase', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ idToken: await result.user.getIdToken() })
      });
      if (!response.ok) throw new Error(await response.text());
      const data = await response.json();
      window.location.href = data.redirect || '/dashboard';
    } catch (error) {
      console.error('Google sign-in failed:', error);
      alert('Google sign-in failed. Please try again.');
    }
  };
</script>

<!-- Google Sign-In Button -->
<button onclick="signInWithGoogle()" class="btn btn-primary">
  Sign in with Google
</button>
